<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Arcoíris - Carta Digital</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="header rainbow-neon-border">
        <div class="header-overlay"></div>
        <div class="header-content">
            <div class="header-left">
                <div class="logo-container">
                    <img src="assets/img_logo/logo.webp" alt="Logo" class="logo">
                </div>
                <div class="header-text">
                    <h1>Restaurant Arcoíris</h1>
                    <p class="subtitle">🍽️ "Donde Jorgito" — Tradición y sabor chileno</p>
                </div>
            </div>
            <div class="header-contact">
                <div class="contact-item"><i class="fa-solid fa-phone"></i> +56959902927</div>
                <div class="contact-item"><i class="fa-solid fa-location-dot"></i> San Francisco 8430</div>
                <div class="contact-item"><i class="fa-brands fa-instagram"></i> Restaurant_arcoiris</div>
            </div>
        </div>
    </header>

    <!-- Pestañas de navegación idénticas -->
    <nav class="category-nav">
        <button class="tab-btn active" onclick="openCategory(event, 'menu-dia')">Menú del Día</button>
        <button class="tab-btn" onclick="openCategory(event, 'picar')">Para Picar</button>
        <button class="tab-btn" onclick="openCategory(event, 'tomar')">Para Tomar</button>
        <button class="tab-btn" onclick="openCategory(event, 'bajativos')">Bajativos</button>
    </nav>

    <!-- Contenedor dinámico de secciones -->
    <main class="menu-container-full">
        <section id="menu-dia" class="menu-section active"></section>
        <section id="picar" class="menu-section"></section>
        <section id="tomar" class="menu-section"></section>
        <section id="bajativos" class="menu-section"></section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Restaurant Arcoíris - Todos los derechos reservados.</p>
    </footer>

    <!-- Script principal -->
    <script src="js/script.js"></script>
</body>
</html>
