<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Restaurant Arcoíris</title>
    
    <!-- Enlace a los estilos generales -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Fuentes y Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header rainbow-neon-border">
        <div class="header-overlay"></div>
        <div class="header-content">
            <div class="header-left">
                <div class="logo-container">
                    <img src="assets/img_logo/logo.webp" alt="Logo" class="logo">
                </div>
                <div class="header-text">
                    <h1>Panel Administrador</h1>
                    <p class="subtitle">Restaurant Arcoíris</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Pantalla de Inicio de Sesión -->
    <div id="login-screen">
        <h2 style="color: var(--primary-color); margin-bottom: 10px;">Acceso Seguro</h2>
        <p style="font-size: 0.9rem; color: #555;">Ingrese sus credenciales de administrador</p>
        
        <input type="email" id="admin-email" class="login-input" placeholder="Correo electrónico">
        <input type="password" id="admin-pass" class="login-input" placeholder="Contraseña">
        
        <button class="save-btn" onclick="loginWithSupabase()" style="width: 100%; margin-top: 10px;">Ingresar</button>
        <p id="auth-msg"></p>
        
        <a class="forgot-pass-link" onclick="recoverPassword()">¿Olvidaste tu contraseña?</a>
    </div>

    <!-- Pantalla para Establecer Nueva Contraseña -->
    <div id="update-password-screen">
        <h2 style="color: var(--primary-color); margin-bottom: 10px;">Nueva Contraseña</h2>
        <p style="font-size: 0.9rem; color: #555;">Ingresa tu nueva clave de acceso</p>
        
        <input type="password" id="new-admin-pass" class="login-input" placeholder="Nueva contraseña">
        <button class="save-btn" onclick="updatePassword()" style="width: 100%; margin-top: 10px;">Actualizar Contraseña</button>
        <p id="update-msg"></p>
    </div>

    <!-- Panel de Administración -->
    <div id="admin-panel-content" class="admin-container">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver a la Carta Digital</a>
        <br>
        <button class="save-btn" onclick="saveChanges()"><i class="fa-solid fa-floppy-disk"></i> Guardar Cambios</button>
        
        <div id="admin-sections-container"></div>
    </div>

    <!-- Scripts externos enlazados en orden correcto -->
    <script src="js/script.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
